# Cloudflare Workers: serves the static site from `out`.
# In Cloudflare's build settings: build command `npm run build`, deploy command `npx wrangler deploy`.
# Only needed if the site is hosted on Cloudflare; Vercel ignores this file.
name = "courses"
compatibility_date = "2026-02-02"

[assets]
directory = "./out"
not_found_handling = "404-page"
