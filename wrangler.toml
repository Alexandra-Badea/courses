# Cloudflare Workers: serves the static site from `out`.
# In Cloudflare's build settings: build command `npm run build`, deploy command `npx wrangler deploy`.
# Only needed if the site is hosted on Cloudflare; Vercel ignores this file.
name = "courses"
compatibility_date = "2026-02-02"

# The site's addresses. On deploy, Cloudflare creates their DNS records and HTTPS certificates.
routes = [
  { pattern = "coursebug.com", custom_domain = true },
  { pattern = "www.coursebug.com", custom_domain = true },
]
# Only the domains above: no courses.<account>.workers.dev address
workers_dev = false
preview_urls = false

[assets]
directory = "./out"
not_found_handling = "404-page"
