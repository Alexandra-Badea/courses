# Cloudflare Workers: serves the static site from `out`.
# Only needed if the site is hosted on Cloudflare; Vercel ignores this file.
name = "courses"
compatibility_date = "2026-02-02"

# Cloudflare's build runs `npx wrangler deploy` on a fresh checkout, where `out` doesn't exist yet,
# so wrangler builds the site first.
[build]
command = "npm run build"

[assets]
directory = "./out"
not_found_handling = "404-page"
